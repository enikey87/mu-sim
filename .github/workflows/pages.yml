# CI: на каждый PR — тесты, типы и сборка.
# Push в main — сборка и публикация на GitHub Pages
# (в настройках репозитория Pages → Source = «GitHub Actions»).
#
# Прогон разбит на параллельные job'ы: tests (всё, кроме гейта покрытия),
# coverage (настоящие партии ботом) и e2e (браузеры) — плюс обязательный чек
# ruleset'а build: он зелёный только когда зелёны все три. Job changes считает,
# трогает ли PR только документацию: такие PR тяжёлые job'ы пропускают
# (проверять в них нечего), но обязательный чек остаётся на месте.
name: CI & Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # docs-only: все изменения PR — docs/** или *.md. Пустой диф считаем кодом:
  # пустой коммит — штатный способ прогнать весь CI, он не должен пропускать тесты.
  # Если PR молчит («no checks», событие не доставлено — транзиент GitHub, 19.10 ×2, #1125):
  # gh workflow run pages.yml --ref <ветка> — надёжный будильник, проверен.
  changes:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-changes-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename'); then
            echo "не удалось получить список файлов — считаем кодом" >&2
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "изменённые файлы:"; echo "$files"
          code=true
          if [ -n "$files" ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                *.md|docs/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = false ] && echo "PR трогает только документацию" || echo "PR трогает код"

  tests:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # новые прогоны вытесняют старые: сборка предыдущего коммита больше не нужна
    concurrency:
      group: pages-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      # кэш eslint: тёплый lint 0.7s против 4.7s холодного (замер локально). Стратегия content,
      # а не дефолтная metadata: на свежем checkout'е mtimes новые и metadata-кэш протухает
      # (проверено: после touch всех файлов metadata 5.0s, content 0.7s). Файл лежит внутри
      # node_modules, поэтому восстанавливается только после npm ci.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      # настоящие партии ботом — в job'е coverage: здесь всё остальное (в т.ч. дрейф RARE)
      - run: npx vitest run --exclude 'src/tools/coverage-gate.test.ts'
      - run: npm run test:rules   # движок правил — покрытие 100%
      # на PR прод-сборку гоняет e2e (webServer собирает dist), здесь она нужна только артефакту Pages
      # Ключи аналитики — из переменных репозитория (Settings → Secrets and variables → Actions → Variables);
      # не заданы — пустые строки, приёмники молчат, сборка зелёная (docs/design/analytics.md).
      - if: github.event_name != 'pull_request'
        run: npm run build
        env:
          VITE_METRIKA_COUNTER: ${{ vars.VITE_METRIKA_COUNTER }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
      # Telegram Mini App (#1236): та же витрина с адаптером telegram — в подпуть /t/ того же
      # Pages-сайта (base './' относительный: бандл сам решает пути, отдельный base не нужен).
      # Инвойс Stars — из переменных репозитория: пусто → pay50 нет → карточки доната нет (#1249).
      # Аналитика — та же, что в веб-корне: обе точки входа мерятся одинаково (#790).
      - if: github.event_name != 'pull_request'
        run: mv dist site
      - if: github.event_name != 'pull_request'
        run: npm run build
        env:
          VITE_PLATFORM: telegram
          VITE_TELEGRAM_INVOICE_URL: ${{ vars.VITE_TELEGRAM_INVOICE_URL }}
          VITE_METRIKA_COUNTER: ${{ vars.VITE_METRIKA_COUNTER }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
      - if: github.event_name != 'pull_request'
        run: mv dist site/t
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  coverage:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-coverage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      # гейт (#278) на своём раннере: без конкуренции с остальным прогоном
      - run: npx vitest run src/tools/coverage-gate.test.ts

  e2e:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      # Браузеры не кэшируем: замер 99b6a47 — с кэшем 23s, без 22s (раздача apt доминирует
      # и не кэшируется, восстановление ~300 МБ стоит как скачивание). Холодные 2m56s — сбой сети.
      # --only-shell: e2e идёт headless, полный Chrome for Testing не нужен (проверено локально
      # с спрятанным полным chromium — тест проходит на headless shell), а скачивание меньше
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e   # webServer сам собирает dist перед preview

  build:
    # Обязательный чек ruleset'а «main: PR + green build + up to date»: зелёный, когда
    # зелёны все три job'а. Документационному PR тяжёлые job'ы пропущены намеренно —
    # для него чека достаточно без них (проверять нечего: ни кода, ни сборки).
    if: always()
    needs: [changes, tests, coverage, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Все три job'а зелёные (или PR только с документацией)
        run: |
          echo "event=${{ github.event_name }} code=${{ needs.changes.outputs.code }} tests=${{ needs.tests.result }} coverage=${{ needs.coverage.result }} e2e=${{ needs.e2e.result }}"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.outputs.code }}" = "false" ]; then
            echo "PR трогает только документацию — тяжёлые job'ы пропущены намеренно"
            exit 0
          fi
          test "${{ needs.tests.result }}" = success
          test "${{ needs.coverage.result }}" = success
          test "${{ needs.e2e.result }}" = success

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    # начатая публикация досчитывается, следующая встаёт в очередь: отмена оставляет деплой незавершённым
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
