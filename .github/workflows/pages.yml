# CI: на каждый PR — тесты, типы и сборка.
# Push в main — сборка и публикация на GitHub Pages
# (в настройках репозитория Pages → Source = «GitHub Actions»).
name: CI & Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # новые прогоны вытесняют старые: сборка предыдущего коммита больше не нужна
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules   # движок правил — покрытие 100%
      - run: npm run rules:stable # список RARE не протух
      - run: npm run build
      - run: npm run test:e2e
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # начатая публикация досчитывается, следующая встаёт в очередь: отмена оставляет деплой незавершённым
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
