<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Алик, где деньги?</title>
  <meta name="description" content="Браузерная юмор-игра: SMS-переписка с генподрядчиком Аликом Воздухонесяном. Ты просишь зарплату — он отвечает новой абсурдной отмазкой. Иногда на фоне кто-то говорит «Мууууу».">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Алик, где деньги?">
  <meta property="og:title" content="Алик, где деньги?">
  <meta property="og:description" content="SMS с генподрядчиком Аликом: вежливо просишь деньги — получаешь отмазку. Иногда «Мууууу».">
  <meta property="og:url" content="https://enikey87.github.io/mu-sim/">
  <meta property="og:locale" content="ru_RU">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Алик, где деньги?">
  <meta name="twitter:description" content="SMS с генподрядчиком Аликом: вежливо просишь деньги — получаешь отмазку. Иногда «Мууууу».">
  <meta name="theme-color" content="#d9dde3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0e12" media="(prefers-color-scheme: dark)">
  <!-- Шелл холодной загрузки (#1443): первый кадр без JS и без внешних файлов. Это инлайн-копия рамки
       телефона, шапки чата и пузыря «печатает…» из src/styles.css — палитру и размеры менять вместе.
       React стирает содержимое #root при монтировании, поэтому шелл исчезает сам (тест: tests/e2e/boot-shell.spec.ts).
       Ниже — титры интро (#1444): блок intro-css дословно повторяет правила src/styles.css, чтобы экран
       блокировки рисовался до прихода пакета; рамку #intro-frame создаёт вход страницы (src/intro/shell.ts). -->
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #d9dde3; color: #111418;
      font: 15px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #boot {
      display: flex; flex-direction: column; overflow: hidden;
      width: 400px; height: min(820px, 100vh);
      background: #e7ebe4; border: 10px solid #111; border-radius: 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    }
    #boot .boot-head { display: flex; align-items: center; gap: 10px; padding: 10px; background: #fff; }
    #boot .boot-ava {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #f0a24a, #d2553a); color: #fff;
      display: grid; place-items: center; font-weight: 700; font-size: 18px;
    }
    #boot .boot-name { font-weight: 700; }
    #boot .boot-status { font-size: 12px; color: #2f9e5c; }
    #boot .boot-bubble {
      align-self: flex-start; display: flex; gap: 4px;
      margin: 12px 10px; padding: 10px 14px;
      background: #fff; border-radius: 14px;
    }
    #boot .boot-bubble i { width: 7px; height: 7px; border-radius: 50%; background: #7b8591; animation: boot-blink 1.2s infinite; }
    #boot .boot-bubble i:nth-child(2) { animation-delay: .2s; }
    #boot .boot-bubble i:nth-child(3) { animation-delay: .4s; }
    @keyframes boot-blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #boot .boot-bubble i { animation: none; opacity: 1; } }
    @media (max-width: 500px) {
      #boot {
        width: 100%; height: 100dvh; border: 0; border-radius: 0;
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0e12; color: #e9edf1; }
      #boot { background: #0f1a1f; }
      #boot .boot-head, #boot .boot-bubble { background: #17212b; }
      #boot .boot-status { color: #5fc98a; }
      #boot .boot-bubble i { background: #8a97a4; }
    }
    /* Рамка титров шелла (#1444): та же, что у .phone из src/styles.css — приложение грузится параллельно
       и появляется ровно в этой коробке. Копия рамки, менять вместе с .phone. */
    #intro-frame {
      position: fixed; inset: 0; margin: auto; z-index: 10;
      width: 400px; height: min(820px, 100vh);
      border: 10px solid #111; border-radius: 36px; overflow: hidden;
    }
    @media (max-width: 500px) {
      #intro-frame {
        width: 100%; height: 100dvh; border: 0; border-radius: 0;
        padding-top: env(safe-area-inset-top, 0px);
      }
    }

    /* intro-css:start — блок дословно повторён в index.html: те же правила рисуют титры шелла холодной
       загрузки (#1444) до прихода этого файла. Менять в двух местах сразу: расхождение ловит
       src/tools/intro-shell.test.ts. */
    /* Интро v2: приглушённый экран блокировки, пять строк-титров по одной, титул, уезд в чат */
    .intro {
      position: absolute; inset: 0; z-index: 70; overflow: hidden;
      color: #fff; cursor: pointer; user-select: none;
      background: linear-gradient(160deg, #3a2a5a, #1a1f3a 55%, #0e1424);
    }
    .intro-leave { transform: translateY(-100%); transition: transform .45s ease-in; }
    .intro-clock { position: absolute; top: 44px; left: 0; right: 0; text-align: center; opacity: .35; }
    .intro-date { font-size: 14px; opacity: .85; }
    .intro-time { font-size: 60px; font-weight: 300; letter-spacing: -1px; line-height: 1.05; }
    .intro-line {
      position: absolute; left: 22px; right: 22px; top: 42%; transform: translateY(-50%);
      text-align: center; font-weight: 700; font-size: 28px; line-height: 1.2;
      text-shadow: 0 2px 12px rgba(0,0,0,.55);
      pointer-events: none;
      opacity: 0;
    }
    .intro-line.on { animation: intro-line-in .28s ease both; }
    .intro-line.out { animation: intro-line-out .28s ease both; }
    @keyframes intro-line-in { from { opacity: 0 } to { opacity: 1 } }
    @keyframes intro-line-out { from { opacity: 1 } to { opacity: 0 } }
    .intro-hint { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 13px; opacity: .85; animation: intro-pulse 1.6s ease-in-out infinite; }
    /* строка о счётчике: на интро — над подсказкой, в досье — в потоке (#611) */
    .intro .track-note { position: absolute; bottom: 50px; left: 22px; right: 22px; }
    .track-note { margin: 0; font-size: 12px; opacity: .6; text-align: center; }
    @keyframes intro-pulse { 50% { opacity: .35 } }
    .intro-title {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: rgba(8,10,18,.72); opacity: 0; transition: opacity .28s ease; pointer-events: none;
    }
    .intro-title.on { opacity: 1; }
    .intro-title-big { font-weight: 700; font-size: 38px; text-align: center; line-height: 1.05; }
    .intro-moo {
      font-weight: 700; font-size: 22px; color: #ffe9a8;
      text-shadow: 0 2px 8px rgba(0,0,0,.4);
      animation: intro-moo 1.8s ease-out both;
    }
    @keyframes intro-moo { 0% { opacity: 0; transform: scale(.6) } 20% { opacity: 1; transform: scale(1.1) } 100% { opacity: 1; transform: scale(1) } }
    /* reduced: те же карточки по очереди, без появления, затухания и уезда */
    .intro-reduced .intro-line, .intro-reduced .intro-title { transition: none; animation: none; }
    .intro-reduced .intro-line.on { opacity: 1; }
    .intro-reduced .intro-line.out { opacity: 0; }
    .intro-reduced .intro-moo, .intro-reduced .intro-hint { animation: none; }
    .intro-reduced .intro-moo { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .intro-line, .intro-title { transition: none; animation: none; }
      .intro-line.on { opacity: 1; }
      .intro-line.out { opacity: 0; }
      .intro-moo, .intro-hint { animation: none; }
      .intro-leave { transition: none; }
    }
    /* intro-css:end */
  </style>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>">
</head>
<body>
  <!-- Шелл холодной загрузки (#1443): виден, пока грузится и не смонтировался основной пакет. -->
  <div id="root">
    <div id="boot" role="status">
      <div class="boot-head">
        <div class="boot-ava" aria-hidden="true">А</div>
        <div>
          <div class="boot-name">Алик</div>
          <div class="boot-status">печатает…</div>
        </div>
      </div>
      <div class="boot-bubble" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </div>
  <script type="module" src="/src/intro/shell.ts"></script>
</body>
</html>
