  <meta name="theme-color" content="#d9dde3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0e12" media="(prefers-color-scheme: dark)">
  <!-- Экран блокировки (#1522): первый кадр — этот HTML, без JS и внешних файлов. Замок стоит вне #root:
       React стирает контейнер, а замок должен дожить до первого кадра чата и уехать поверх него.
       Рамка — та же коробка, что у .phone; цвета — палитра src/styles.css (сторож: src/tools/boot-shell.test.ts).
       Ниже — титры интро (#1444): блок intro-css дословно повторяет правила src/styles.css, чтобы титры
       рисовались до пакета; сами титры дорабатывают этот же замок (src/intro/mount.ts). -->
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; background: #d9dde3; color: #111418; font: 15px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; }
    /* Рамка — копия .phone из src/styles.css. --boot-hint-delay — порог появления уровня (#1522): меняется в одном месте, JS его не читает. */
    #intro-frame { --boot-hint-delay: .3s; position: fixed; inset: 0; margin: auto; z-index: 10; width: 400px; height: min(820px, 100vh); border: 10px solid #111; border-radius: 36px; overflow: hidden; }
    @media (max-width: 500px) { #intro-frame { width: 100%; height: 100dvh; border: 0; border-radius: 0; padding-top: env(safe-area-inset-top, 0px); } }
    /* Уровень (#1476) виден только с классом booting: animation-delay + fill-mode backwards и есть порог (#1522). */
    #lock-screen .lvl{display:none;position:relative;overflow:hidden;width:216px;height:38px;border-radius:19px;background:#fff;border:2px solid #7b8591}
    #lock-screen .lvl::before,#lock-screen .lvl::after{content:"";position:absolute;top:6px;bottom:6px;width:2px;border-radius:1px;background:#7b8591}
    #lock-screen .lvl::before{left:calc(50% - 6px)}#lock-screen .lvl::after{left:calc(50% + 4px)}
    #lock-screen .spr{position:absolute;top:5px;bottom:5px;left:10px;width:58px;border-radius:14px;background:radial-gradient(circle at 35% 30%,#d9dde3,#7b8591);box-shadow:0 1px 3px rgba(0,0,0,.25),inset 0 -2px 4px rgba(0,0,0,.12);animation:hunt 3.2s ease-in-out infinite}
    @keyframes hunt{0%{left:10px}42%{left:71px}58%{left:84px}74%{left:76px}100%{left:10px}}
    @keyframes lvl-in{from{opacity:0}}
    #lock-screen.booting .lvl{display:block;animation:lvl-in .3s ease var(--boot-hint-delay) backwards}
    #lock-screen .fl{display:none;max-width:260px;text-align:center;font-size:13px;color:#e9edf1}
    #lock-screen.msg .fl,#lock-screen.failed .fl{display:block}
    #lock-screen.msg .lvl,#lock-screen.failed .lvl{display:none}
    #lock-screen.failed .intro-hint{display:none}
    #boot-again{padding:8px 14px;border:0;border-radius:10px;background:#2f9e5c;color:#fff;font:inherit}
    @media (prefers-reduced-motion:reduce){#lock-screen .spr{animation:none;left:calc(50% - 29px)}#lock-screen.booting .lvl{animation-duration:0s}}
    @media (prefers-color-scheme:dark){body{background:#0b0e12;color:#e9edf1}#lock-screen .lvl{background:#0b0e12;border-color:#8a97a4}#lock-screen .lvl::before,#lock-screen .lvl::after{background:#8a97a4}#lock-screen .spr{background:radial-gradient(circle at 35% 30%,#e9edf1,#8a97a4)}}

    /* intro-css:start — блок дословно повторён в styles.css: те же правила рисуют титры шелла холодной
   загрузки (#1444) до прихода пакета. Менять в двух местах сразу: расхождение ловит
   src/tools/intro-shell.test.ts. */
/* Интро v2: приглушённый экран блокировки, пять строк-титров по одной, титул, уезд в чат */
.intro {
  position: absolute; inset: 0; z-index: 70; overflow: hidden;
  color: #fff; cursor: pointer; user-select: none;
  background: linear-gradient(160deg, #3a2a5a, #1a1f3a 55%, #0e1424);
}
.intro-leave { transform: translateY(-100%); transition: transform .45s ease-in; }
.intro-clock { position: absolute; top: 44px; left: 0; right: 0; text-align: center; opacity: .35; }
.intro-date { font-size: 14px; opacity: .85; }
.intro-time { font-size: 60px; font-weight: 300; letter-spacing: -1px; line-height: 1.05; }
.intro-line {
  position: absolute; left: 22px; right: 22px; top: 42%; transform: translateY(-50%);
  text-align: center; font-weight: 700; font-size: 28px; line-height: 1.2;
  text-shadow: 0 2px 12px rgba(0,0,0,.55);
  pointer-events: none;
  opacity: 0;
}
.intro-line.on { animation: intro-line-in .28s ease both; }
.intro-line.out { animation: intro-line-out .28s ease both; }
@keyframes intro-line-in { from { opacity: 0 } to { opacity: 1 } }
@keyframes intro-line-out { from { opacity: 1 } to { opacity: 0 } }
/* низ замка (#1522): подсказка до касания, под ней — уровень загрузки (шелл) и строка отказа */
.intro-foot {
  position: absolute; bottom: 22px; left: 0; right: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 22px;
}
.intro-hint { font-size: 13px; opacity: .85; animation: intro-pulse 1.6s ease-in-out infinite; }
.track-note { margin: 0; font-size: 12px; opacity: .6; text-align: center; }
@keyframes intro-pulse { 50% { opacity: .35 } }
.intro-title {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; background: rgba(8,10,18,.72); opacity: 0; transition: opacity .28s ease; pointer-events: none;
}
.intro-title.on { opacity: 1; }
.intro-title-big { font-weight: 700; font-size: 38px; text-align: center; line-height: 1.05; }
.intro-moo {
  font-weight: 700; font-size: 22px; color: #ffe9a8;
  text-shadow: 0 2px 8px rgba(0,0,0,.4);
  animation: intro-moo 1.8s ease-out both;
}
@keyframes intro-moo { 0% { opacity: 0; transform: scale(.6) } 20% { opacity: 1; transform: scale(1.1) } 100% { opacity: 1; transform: scale(1) } }
/* reduced: те же карточки по очереди, без появления, затухания и уезда */
.intro-reduced .intro-line, .intro-reduced .intro-title { transition: none; animation: none; }
.intro-reduced .intro-line.on { opacity: 1; }
.intro-reduced .intro-line.out { opacity: 0; }
.intro-reduced .intro-moo, .intro-reduced .intro-hint { animation: none; }
.intro-reduced .intro-moo { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .intro-line, .intro-title { transition: none; animation: none; }
  .intro-line.on { opacity: 1; }
  .intro-line.out { opacity: 0; }
  .intro-moo, .intro-hint { animation: none; }
  .intro-leave { transition: none; }
}
/* intro-css:end */
  </style>
  <!-- Сторож холодной загрузки (1477): ошибка загрузчика и тайм-аут 12 с — одна перезагрузка за сессию,
       потом строка отказа на замке. Сигнал __alikBoot ставит первая строка src/intro/shell.ts; без него игра не живёт. -->
  <script>
    ;(function(){
      var K='alik-boot-retry',f=0
      function fail(){
        if(f||window.__alikBoot)return
        f=1
        var r=false,b
        try{r=sessionStorage.getItem(K)==='1';if(!r)sessionStorage.setItem(K,'1')}catch(e){r=true}
        if(!r)return location.reload()
        if(b=document.getElementById('lock-screen'))b.className+=' failed'
      }
      addEventListener('error',function(e){if(e.target.tagName==='SCRIPT')fail()},true)
      setTimeout(fail,12000)
    })()
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>">
</head>
<body>
  <!-- Экран блокировки (#1522): один на всю холодную загрузку. Титры дорабатывают этот же #lock-screen
       (src/intro/mount.ts), уход в чат увозит его вверх; #root пуст, пока не смонтируется пакет. -->
  <div id="root"></div>
  <div id="intro-frame">
    <div id="lock-screen" class="intro">
      <div class="intro-clock"><div class="intro-date">18 марта 2026 г.</div><div class="intro-time">--:--</div></div>
      <div class="intro-foot"><div class="lvl" aria-hidden="true"><span class="spr"></span></div><div class="fl">Алик не дозвонился. Проверьте сеть и обновите страницу.</div><button type="button" id="boot-again" hidden>Попробовать снова</button><noscript><p>Игра живёт на JavaScript — включите его.</p></noscript></div>
    </div>
  </div>
  <!-- Сборка снимает с тега навесные атрибуты (onerror) — отказ загрузчика сторожа ловит window error в capture,
       см. инлайн-скрипт в <head> (1477). -->
  <script type="module" src="/src/intro/shell.ts"></script>
</body>
</html>
